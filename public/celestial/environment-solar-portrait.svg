<path d="M110 -40 L170 -40 L430 1300 L370 1300 Z" fill="url(#shaft)" opacity="0.26" filter="url(#sb14)"/>
<path d="M220 -40 L330 -40 L590 1300 L480 1300 Z" fill="url(#shaft)" opacity="0.2" filter="url(#sb14)"/>
