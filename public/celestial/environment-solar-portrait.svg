<!-- the marble floor: the room has a ground, with the sky's light in it -->
<rect x="0" y="1300" width="900" height="300" fill="url(#marble)"/>
<rect x="0" y="1300" width="900" height="1.6" fill="#c9a86c" opacity=".55"/>
<ellipse cx="450" cy="1670" rx="558" ry="160" fill="none" stroke="#c4a468" stroke-width="2" opacity=".42"/>
<ellipse cx="450" cy="1670" rx="414" ry="115.2" fill="none" stroke="#c4a468" stroke-width="1.4" opacity=".3"/>
<ellipse cx="450" cy="1666" rx="540" ry="160" fill="none" stroke="#fff" stroke-width="14" opacity=".5" filter="url(#sb18)"/>
